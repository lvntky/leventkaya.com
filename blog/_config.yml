url: "https://leventkaya.com"
baseurl: ""
lang: en
timezone: "Europe/Istanbul"
title: "Levent Kaya"
description: "Low-level programming, OS internals, graphics from scratch, debugger internals, and retrocomputing. Written in C and C++."
email: leventkayadev@gmail.com
favicon: /assets/images/favicon.png

author:
  name: "Levent Kaya"
  email: leventkayadev@gmail.com

social:
  name: "Levent Kaya"
  links:
    - "https://github.com/lvntky"
    - "https://www.linkedin.com/in/lvntky/"

theme: jekyll-theme-low
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

permalink: /:title/

feed:
  path: rss.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      image: "https://leventkaya.com/assets/images/logo.png"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

logo: "https://leventkaya.com/assets/images/logo.png"
image: "https://leventkaya.com/assets/images/logo.png"

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md