url: "https://leventkaya.com"
baseurl: ""
lang: en
timezone: "Europe/Istanbul"

title: "Levent Kaya"
tagline: "Levent Kaya — Technical Blog and Notes"
description: "C and C++ deep dives into OS internals, graphics, debugger internals, and retrocomputing."

email: leventkayadev@gmail.com
favicon: /assets/images/favicon.png

author:
  name: "Levent Kaya"
  email: leventkayadev@gmail.com

twitter_username: lvntky

social:
  name: "Levent Kaya"
  links:
    - "https://github.com/lvntky"
    - "https://www.linkedin.com/in/lvntky/"

bio: "I write about the parts of computing most people never touch — OS
  internals, Linux systems programming, CPU emulation, graphics from scratch,
  and retrocomputing. Everything is implemented in C or C++, with full source
  code. Currently pursuing graduate research in async I/O and syscall runtimes
  on Linux."

bio_links:
  - label: "GitHub"
    url: "https://github.com/lvntky"
  - label: "Projects"
    url: "https://leventkaya.com/projects/"
  - label: "About"
    url: "https://leventkaya.com/about/"

theme: jekyll-theme-low
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

permalink: /:title/

feed:
  path: rss.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      image: "https://leventkaya.com/assets/images/logo.png"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

logo: "https://leventkaya.com/assets/images/logo.png"
image: "https://leventkaya.com/assets/images/logo.png"

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md